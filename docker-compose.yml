services:
  postgres:
    image: postgres:18
    container_name: linkbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkbase
      POSTGRES_PASSWORD: linkbase
      POSTGRES_DB: linkbase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgressql

volumes:
  postgres_data:
